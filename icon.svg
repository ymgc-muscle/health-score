<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#ff5f00"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d94a"/>
      <stop offset="1" stop-color="#19b93b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,8 L0,16 Z" fill="#22c943"/>
    </marker>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Green progress arc: 12 o'clock clockwise to 9 o'clock; arrow points upward at the end -->
  <path d="M256 88 A168 168 0 1 1 88 256"
        fill="none" stroke="url(#green)" stroke-width="34"
        stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Remaining quarter shown as white dotted arc -->
  <path d="M88 256 A168 168 0 0 1 256 88"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round" stroke-dasharray="2 30"/>

  <!-- Central check -->
  <path d="M177 267 L230 320 L342 190"
        fill="none" stroke="url(#green)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
