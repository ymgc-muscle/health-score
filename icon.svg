<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#ff5f00"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d94a"/>
      <stop offset="1" stop-color="#19b93b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Progress arc: 12 o'clock clockwise to 9 o'clock -->
  <path d="M256 92 A164 164 0 1 1 92 256"
        fill="none" stroke="url(#green)" stroke-width="34"
        stroke-linecap="round"/>

  <!-- Explicit upward arrowhead; avoids SVG marker rendering differences on Android launchers -->
  <path d="M92 218 L65 260 L119 260 Z" fill="#22c943"/>

  <!-- Remaining quarter -->
  <path d="M92 256 A164 164 0 0 1 256 92"
        fill="none" stroke="#ffffff" stroke-width="28"
        stroke-linecap="round" stroke-dasharray="2 29"/>

  <!-- Central check -->
  <path d="M179 267 L231 319 L340 192"
        fill="none" stroke="url(#green)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
