name: Health Score push reminders

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 17 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '0 21 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      reminder:
        description: Reminder to send
        required: true
        default: test
        type: choice
        options:
          - test
          - morning
          - evening
          - night

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select reminder
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            kind="${{ inputs.reminder }}"
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * *") kind="morning" ;;
              "30 17 * * *") kind="evening" ;;
              "0 21 * * *") kind="night" ;;
              *) kind="test" ;;
            esac
          fi
          echo "REMINDER_KIND=$kind" >> "$GITHUB_ENV"

      - name: Install Web Push sender
        run: npm install --no-save --no-package-lock web-push@3

      - name: Send notification
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs
